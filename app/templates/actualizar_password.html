{% extends "base.html" %}
{% block title %}Actualizar Contraseña · Wesbyte{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="container-xl">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card login-card">
          <div class="card-body p-4 p-lg-5">
            <div class="text-center mb-4">
              <span class="icon-bubble bg-grad-1 mx-auto" style="width:64px;height:64px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;"><i class="ti ti-lock-cog"></i></span>
              <h2 class="mt-3 mb-1" style="font-weight:900;letter-spacing:-.03em;">Actualiza tu contraseña</h2>
              <p class="text-muted mb-0">Por tu seguridad, debes definir una contraseña personal antes de continuar.</p>
            </div>
            <form onsubmit="actualizarPw(event)">
              <div class="mb-3">
                <label class="form-label fw-bold">Nueva contraseña</label>
                <input type="password" class="form-control form-control-lg" id="nueva_password" minlength="6" placeholder="Mínimo 6 caracteres" required autofocus>
              </div>
              <div class="mb-4">
                <label class="form-label fw-bold">Confirmar nueva contraseña</label>
                <input type="password" class="form-control form-control-lg" id="confirmar_password" minlength="6" placeholder="Repite tu nueva contraseña" required>
              </div>
              <button type="submit" id="btnGuardarPw" class="btn btn-grad btn-lg w-100">
                Guardar y Continuar <i class="ti ti-check ms-1"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
  async function actualizarPw(e) {
    e.preventDefault();
    const p1 = document.getElementById("nueva_password").value;
    const p2 = document.getElementById("confirmar_password").value;
    if (p1 !== p2) {
      Swal.fire("Error", "Las contraseñas no coinciden.", "warning");
      return;
    }
    const b = document.getElementById("btnGuardarPw");
    const o = b.innerHTML;
    b.disabled = true; b.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Guardando...';
    try {
      const r = await fetch("/api/actualizar-password", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ nueva_password: p1, confirmar_password: p2 })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || "No se pudo actualizar la contraseña");
      await Swal.fire("¡Contraseña actualizada!", j.message || "Tu nueva contraseña está lista.", "success");
      window.location.href = j.redirect_url || "/mi-portal";
    } catch (err) {
      Swal.fire("Error", err.message, "error");
      b.disabled = false; b.innerHTML = o;
    }
  }
</script>
{% endblock %}
