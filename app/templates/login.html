{% extends "base.html" %}
{% block title %}Ingresar · Wesbyte{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="container-xl">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card login-card">
          <div class="card-body p-4 p-lg-5">
            <div class="text-center mb-4">
              <span class="icon-bubble bg-grad-1 mx-auto" style="width:64px;height:64px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;"><i class="ti ti-layout-dashboard"></i></span>
              <h2 class="mt-3 mb-1" style="font-weight:900;letter-spacing:-.03em;">Bienvenido a tu portal</h2>
              <p class="text-muted mb-0">Ingresa para ver tus procesos, dashboards y seguimiento.</p>
            </div>
            <form onsubmit="entrar(event)">
              <div class="mb-3">
                <label class="form-label fw-bold">Usuario o correo</label>
                <input type="text" class="form-control form-control-lg" id="usuario" required autofocus>
              </div>
              <div class="mb-4">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" class="form-control form-control-lg" id="password" required>
              </div>
              <button type="submit" id="btnEntrar" class="btn btn-grad btn-lg w-100">Ingresar <i class="ti ti-arrow-right ms-1"></i></button>
            </form>
            <div class="text-center mt-4 small text-muted">
              ¿Aún no eres cliente? <a href="/#planes-grid" class="fw-bold">Elige tu plan</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
  async function entrar(e) {
    e.preventDefault();
    const b = document.getElementById("btnEntrar");
    const o = b.innerHTML;
    b.disabled = true; b.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Ingresando...';
    try {
      const r = await fetch("/api/ingresar", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({usuario: document.getElementById("usuario").value, password: document.getElementById("password").value})
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || "No se pudo ingresar");
      window.location.href = j.redirect_url;
    } catch (err) {
      Swal.fire("No pudimos ingresarte", err.message, "error");
      b.disabled = false; b.innerHTML = o;
    }
  }
</script>
{% endblock %}
